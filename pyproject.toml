[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "django-analytics-middleware"
version = "0.1.1"
description = "Django middleware for request analytics logging"
readme = "README.md"
requires-python = ">=3.7"
license = {text = "MIT"}
authors = [
    {name = "Aaron Browne", email = "github@futurumlabs.net"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Framework :: Django",
]
dependencies = [
    "Django>=2.2",
]

[project.urls]
Homepage = "https://github.com/Knowledgex187/django-audit-analytics-middleware.git"
Source = "https://github.com/Knowledgex187/django-audit-analytics-middleware.git"
Issues = "https://github.com/Knowledgex187/django-audit-analytics-middleware.git/issues"

[tool.setuptools.packages.find]
exclude = ["tests*", "example*"]

[tool.setuptools.package-data]
django_analytics_middleware = ["py.typed"]